name: release

# Tags are pushed by scripts/release.sh; this workflow does everything after
# that - guard the branch, build, publish, and point the tap at the result.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASE_BRANCH: main
  # Workflow level, so the tap job's checkout and the scripts it runs agree on
  # where the tap is - they read both of these straight out of the environment.
  TAP_REPO: vojtechmares/homebrew-tap
  TAP_BRANCH: master

jobs:
  # A tag push carries no branch, and on.push.tags cannot be filtered by one,
  # so the branch check has to happen here. Nothing else runs until it passes.
  guard:
    name: Check the tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tagged commit is on ${{ env.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          # An annotated tag can leave GITHUB_SHA pointing at the tag object
          # rather than the commit, and merge-base wants a commit.
          COMMIT="$(git rev-parse "HEAD^{commit}")"
          if ! git merge-base --is-ancestor "$COMMIT" "origin/$RELEASE_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on $RELEASE_BRANCH - releases are cut from $RELEASE_BRANCH only"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on $RELEASE_BRANCH"

  # The app can only be built on the platform it runs on, so it is a job of its
  # own and the release waits for it: one release carries both, or a user could
  # install an app whose daemon was never published.
  desktop:
    name: Build the desktop app
    needs: guard
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/owl-desktop/frontend/package-lock.json

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # The zip is built by the same script a developer runs, so what ships is
      # what they can reproduce.
      - name: Build the desktop release
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/build-desktop-release.sh "$TAG"
          ZIP="CodingOwl-${TAG#v}-arm64.zip"
          SHA256="$(awk '{ print $1 }' "dist/$ZIP.sha256")"
          # An empty checksum would publish happily and only fail in the tap
          # job, with a cask nobody can install.
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::no checksum for $ZIP in dist/$ZIP.sha256"
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/CodingOwl-*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Build and publish
    needs: [guard, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha256: ${{ steps.build.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version like v0.1.0"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            if [[ "$VERSION" == *-* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      # The archive is built by the same script a developer runs, so what ships
      # is what they can reproduce.
      - name: Build the release
        id: build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/build-release.sh "$TAG"
          ARCHIVE="coding-owl_${TAG}_darwin_arm64.tar.gz"
          SHA256="$(awk -v a="$ARCHIVE" '$2 == a { print $1 }' dist/checksums.txt)"
          # An empty checksum would publish happily and only fail in the tap
          # job, with a formula nobody can install.
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::no checksum for $ARCHIVE in dist/checksums.txt"
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      # After the archive, because build-release.sh writes checksums.txt rather
      # than adding to it: one file covering everything the release carries.
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist

      - name: Add the desktop app to the checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="CodingOwl-${VERSION}-arm64.zip"
          cd dist
          # Against the bytes that are about to be published rather than
          # against what the job that built them said: the two travelled
          # separately, and a checksum nobody checked is a checksum of nothing.
          if command -v shasum >/dev/null; then
            shasum -a 256 -c "$ZIP.sha256"
          else
            sha256sum -c "$ZIP.sha256"
          fi
          cat "$ZIP.sha256" >> checksums.txt
          # The per-asset file is how the build hands the digest over; the
          # release carries one checksums.txt and not two spellings of it.
          rm -f "$ZIP.sha256"
          cat checksums.txt

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$(git rev-parse "HEAD^{commit}")" \
            --jq .body > dist/notes.md

          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          ARCHIVE="coding-owl_${TAG}_darwin_arm64.tar.gz"
          # vojtechmares/homebrew-tap is vojtechmares/tap to brew. Strip and
          # rejoin rather than substitute: bash 3.2 keeps the backslash of an
          # escaped "/" in a replacement string.
          TAP="${TAP_REPO%%/*}/${TAP_REPO##*/homebrew-}"

          cat >> dist/notes.md <<EOF

          ## Install

          Apple silicon, macOS.

          ### Homebrew (recommended)

          \`\`\`sh
          brew install $TAP/coding-owl
          brew services start coding-owl
          \`\`\`

          The desktop app comes with the daemon it is a view over:

          \`\`\`sh
          brew install --cask $TAP/coding-owl-desktop
          \`\`\`
          EOF

          # The formula job is skipped for prereleases, so the tap still points
          # at the last stable version - say so rather than let brew look
          # broken.
          if [[ "$PRERELEASE" == "true" ]]; then
            cat >> dist/notes.md <<EOF

          This is a prerelease and the tap only carries stable releases, so brew
          installs $VERSION only once it ships. Until then, use the download
          below.
          EOF
          fi

          cat >> dist/notes.md <<EOF

          ### Download

          [$ARCHIVE]($REPO_URL/releases/download/$TAG/$ARCHIVE)

          \`\`\`
          $SHA256  $ARCHIVE
          \`\`\`
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          ARGS=(--title "$TAG" --notes-file dist/notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ARGS[@]}" \
            "dist/coding-owl_${TAG}_darwin_arm64.tar.gz" \
            "dist/CodingOwl-${TAG#v}-arm64.zip" \
            dist/checksums.txt

  # One job for both, because two jobs pushing to one branch race each other
  # and leave the tap half bumped - which is the opposite of the lockstep
  # ADR-0010 asks for. The formula goes first: what that leaves if the cask
  # cannot be pushed is a newer daemon than app, which is the skew ADR-0004's
  # breaking-change detection is there to make safe. The other way round would
  # leave an app whose daemon nobody can install.
  #
  # The tap lives in another repository, so github.token cannot reach it -
  # HOMEBREW_TAP_TOKEN is a PAT with contents:write on the tap.
  tap:
    name: Point the Homebrew tap at the release
    needs: [guard, desktop, release]
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # An unset secret checks out the public tap happily and only fails on the
      # push, several minutes later, with a bare 403. Say so up front instead.
      - name: Check the tap token is set
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set - it needs a PAT with contents:write on $TAP_REPO"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          ref: ${{ env.TAP_BRANCH }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: true

      - name: Render and push the formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
          REPO: ${{ github.repository }}
          TAP_DIR: ${{ github.workspace }}/tap
        run: ./scripts/bump-formula.sh

      - name: Render and push the cask
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.desktop.outputs.sha256 }}
          REPO: ${{ github.repository }}
          TAP_DIR: ${{ github.workspace }}/tap
        run: ./scripts/bump-cask.sh
