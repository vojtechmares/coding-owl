name: website

# The website reads docs, the changelog, the readme and the glossary out of the
# repository at build time, so a change to any of those is a change to the
# site. Pull requests build; pushes to main build and deploy.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - CHANGELOG.md
      - README.md
      - CONTEXT.md
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - CHANGELOG.md
      - README.md
      - CONTEXT.md
      - .github/workflows/website.yml

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: The build emits a Markdown sibling for every page
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r html; do
            md="${html%.html}.md"
            if [[ "$(basename "$html")" != "404.html" && ! -f "$md" ]]; then
              echo "::error::$html has no $md"
              missing=1
            fi
          done < <(find dist -name '*.html')
          exit "$missing"

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy
