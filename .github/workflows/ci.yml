name: ci

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Modules are tidy
        run: go mod tidy -diff

      - name: buf lint
        run: buf lint

      - name: Generated code is current
        run: buf generate && git diff --exit-code -- gen

      - name: buf breaking against main
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#ref=origin/main'
          else
            echo "main has no buf.yaml yet; nothing to compare against"
          fi
