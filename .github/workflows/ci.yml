name: ci

# Pull requests as well as pushes, so a contribution from a fork is checked
# too - a fork's pushes run in the fork, not here. The pull_request event gives
# a fork's run no secrets and a read-only token, and this workflow needs
# neither.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Modules are tidy
        run: go mod tidy -diff

      - name: buf lint
        run: buf lint

      # The release workflow is code that only ever runs on a tag, where a
      # mistake is found by the release failing. actionlint reads it here
      # instead - an expression naming a job that is not a dependency is the
      # sort of thing it catches.
      - name: Workflows are workflows Actions will run
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            .github/workflows/*.yml

      - name: Generated code is current
        run: buf generate && git diff --exit-code -- gen

      - name: buf breaking against main
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#ref=origin/main'
          else
            echo "main has no buf.yaml yet; nothing to compare against"
          fi

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # pnpm comes before Node so that Node's cache can be keyed on pnpm's
      # store; the version is the one package.json pins.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cmd/owl-desktop/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cmd/owl-desktop/frontend/pnpm-lock.yaml

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build the desktop app
        run: make desktop

      - name: The app is a pure view and its theme is one file
        run: go test ./tests/behavior -run 'TestS3AppUsesOnlySharedClient|TestS10ThemeIsOneTokensFile'
