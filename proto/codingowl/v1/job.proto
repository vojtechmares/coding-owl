syntax = "proto3";

package codingowl.v1;

import "google/protobuf/timestamp.proto";

// JobService queues work against a Project and controls the order it will run
// in. A Job is a standing intent to do one piece of work (ADR-0027); the queue
// is the Jobs still pending, in the order the scheduler will consider them
// (ADR-0025).
service JobService {
  // AddJob queues a Job, producing it through the local queue Source.
  rpc AddJob(AddJobRequest) returns (AddJobResponse) {}
  // ListJobs returns the queue, or every Job whatever its state.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {}
  // CancelJob takes a pending Job out of the queue.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {}
  // ReorderJob moves a pending Job to a position in the queue.
  rpc ReorderJob(ReorderJobRequest) returns (ReorderJobResponse) {}
  // StartRun runs the Job at the head of the queue.
  rpc StartRun(StartRunRequest) returns (StartRunResponse) {}
  // GetJob returns one Job with its Runs and the system prompt in force for
  // it.
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {}
  // StreamRunLog sends a Run's captured output, and with follow keeps sending
  // until the Run ends.
  rpc StreamRunLog(StreamRunLogRequest) returns (stream StreamRunLogResponse) {}
}

// JobState is the lifecycle of a Job (ADR-0025, ADR-0027).
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  // JOB_STATE_PENDING is queued and waiting to be run.
  JOB_STATE_PENDING = 1;
  // JOB_STATE_ACTIVE is being run right now.
  JOB_STATE_ACTIVE = 2;
  // JOB_STATE_BLOCKED is stuck on something wrong with the work.
  JOB_STATE_BLOCKED = 3;
  // JOB_STATE_REVIEW is finished and waiting for a decision.
  JOB_STATE_REVIEW = 4;
  // JOB_STATE_DONE is finished and accepted.
  JOB_STATE_DONE = 5;
  // JOB_STATE_CANCELLED was taken out of the queue by hand.
  JOB_STATE_CANCELLED = 6;
  // JOB_STATE_EXHAUSTED ran out of attempts.
  JOB_STATE_EXHAUSTED = 7;
}

// Job is one standing intent to do a piece of work in one Project.
message Job {
  // Id identifies the Job. It is what owl queue commands take.
  int64 id = 1;
  // Source names the producer the Job came from; the local queue is "local".
  string source = 2;
  // SourceRef is the Job's reference within that Source, unique with it
  // (ADR-0032). The local queue generates a ulid.
  string source_ref = 3;
  // Project is the name of the Project the Job is queued against.
  string project = 4;
  // Prompt is the work to do.
  string prompt = 5;
  // State is where the Job is in its lifecycle.
  JobState state = 6;
  // Position is the Job's place in the queue, counting from one. It is zero
  // for a Job that is not queued.
  int32 position = 7;
  // Created is when the Job was first produced.
  google.protobuf.Timestamp created = 8;
  // Branch is the branch the Job's work lands on, empty until it has one
  // (ADR-0007).
  string branch = 9;
  // Worktree is where that branch is checked out, empty until it has one.
  string worktree = 10;
  // Planned is whether the Job is planned before it is executed (ADR-0026).
  bool planned = 11;
  // Plan is what its planning Run decided, empty until there is one.
  string plan = 12;
  // Reason is why the Job is where it is when no Run explains it: a setup
  // command that failed before an Agent started, or the checks that refused
  // the work.
  string reason = 13;
}

// PlanMode is whether a Job is planned before it is executed. Planning is the
// default, so leaving it unspecified plans (ADR-0026).
enum PlanMode {
  // PLAN_MODE_UNSPECIFIED plans, like PLAN_MODE_PLAN.
  PLAN_MODE_UNSPECIFIED = 0;
  // PLAN_MODE_PLAN plans the Job before executing it.
  PLAN_MODE_PLAN = 1;
  // PLAN_MODE_NO_PLAN executes it without planning first.
  PLAN_MODE_NO_PLAN = 2;
}

// CheckResult is what one Verification check said about a Run (ADR-0013).
message CheckResult {
  // Name identifies the check.
  string name = 1;
  // Command is what it ran.
  string command = 2;
  // Passed is whether it was satisfied.
  bool passed = 3;
  // ExitCode is what the command exited with.
  int32 exit_code = 4;
  // Output is what it printed, standard error included.
  string output = 5;
  // Reason says why it failed, empty for a check that passed.
  string reason = 6;
}

// PhaseSettings is what one phase of a Job runs at, and where each setting
// came from: the defaults, the daemon's configuration, the Project's, or the
// Job itself (ADR-0028).
message PhaseSettings {
  string phase = 1;
  string model = 2;
  string model_from = 3;
  string effort = 4;
  string effort_from = 5;
}

// RunOutcome is how a Run ended (ADR-0027).
enum RunOutcome {
  // RUN_OUTCOME_UNSPECIFIED is a Run that has not ended yet.
  RUN_OUTCOME_UNSPECIFIED = 0;
  // RUN_OUTCOME_SUCCEEDED is an Agent that exited cleanly.
  RUN_OUTCOME_SUCCEEDED = 1;
  // RUN_OUTCOME_FAILED is an Agent that exited non-zero, or could not be run.
  RUN_OUTCOME_FAILED = 2;
  // RUN_OUTCOME_INTERRUPTED is a Run that was stopped rather than finished.
  RUN_OUTCOME_INTERRUPTED = 3;
}

// Run is one attempt to carry out a Job (ADR-0027).
message Run {
  // Id identifies the Run and is what owl logs takes.
  int64 id = 1;
  // JobId is the Job this Run is an attempt at.
  int64 job_id = 2;
  // Attempt counts this Job's Runs, from one.
  int32 attempt = 3;
  // Started is when the Agent was launched.
  google.protobuf.Timestamp started = 4;
  // Ended is when it exited, and is unset while the Run is still going.
  google.protobuf.Timestamp ended = 5;
  // Outcome is how it ended.
  RunOutcome outcome = 6;
  // Error is why it did not succeed.
  string error = 7;
  // LogPath is where its structured output was captured.
  string log_path = 8;
  // Phase is what the Run was carrying out: planning the Job, or executing it.
  string phase = 10;
  // ExitCode is what the Agent exited with, and -1 when it never got far
  // enough to have one.
  int32 exit_code = 9;
}

message AddJobRequest {
  // Project names the Project to queue against. Empty means the Project the
  // working directory is in.
  string project = 1;
  // Prompt is the work to do.
  string prompt = 2;
  // WorkingDir is an absolute path to the directory the caller ran in.
  string working_dir = 3;
  // PlanMode is whether to plan the Job before executing it.
  PlanMode plan_mode = 4;
  // Model and Effort override what every phase of this Job runs at. Empty
  // leaves it to the Project and the defaults.
  string model = 5;
  string effort = 6;
}

message AddJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  // All returns every Job whatever its state, rather than only the queue.
  bool all = 1;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  int64 id = 1;
}

message CancelJobResponse {
  Job job = 1;
}

message ReorderJobRequest {
  int64 id = 1;
  // Position counts from one.
  int32 position = 2;
}

message ReorderJobResponse {
  Job job = 1;
}

message StartRunRequest {}

message StartRunResponse {
  // Started is false when the queue held nothing to run, which is not a
  // failure.
  bool started = 1;
  Job job = 2;
  Run run = 3;
}

message GetJobRequest {
  int64 id = 1;
}

message GetJobResponse {
  Job job = 1;
  repeated Run runs = 2;
  // SystemPrompt is the unattended contract with the Project's own clauses
  // appended, exactly as the Agent is given it (ADR-0017).
  string system_prompt = 3;
  // Checks is what Verification said about the Job's most recent verified Run,
  // in the order the checks were configured (ADR-0030).
  repeated CheckResult checks = 5;
  // Phases is what each phase of the Job runs at, in the order it passes
  // through them.
  repeated PhaseSettings phases = 4;
}

message StreamRunLogRequest {
  int64 run_id = 1;
  // Follow keeps the stream open until the Run ends.
  bool follow = 2;
}

message StreamRunLogResponse {
  // Line is one line of the Agent's structured output.
  string line = 1;
}
