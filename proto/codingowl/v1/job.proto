syntax = "proto3";

package codingowl.v1;

import "codingowl/v1/gc.proto";
import "codingowl/v1/skill.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// JobService queues work against a Project and controls the order it will run
// in. A Job is a standing intent to do one piece of work (ADR-0027); the queue
// is the Jobs still pending, in the order the scheduler will consider them
// (ADR-0025).
service JobService {
  // AddJob queues a Job, producing it through the local queue Source.
  rpc AddJob(AddJobRequest) returns (AddJobResponse) {}
  // ListJobs returns the queue, or every Job whatever its state.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {}
  // CancelJob takes a pending Job out of the queue.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {}
  // ReorderJob moves a pending Job to a position in the queue.
  rpc ReorderJob(ReorderJobRequest) returns (ReorderJobResponse) {}
  // StartRun runs the Job at the head of the queue.
  rpc StartRun(StartRunRequest) returns (StartRunResponse) {}
  // GetJob returns one Job with its Runs and the system prompt in force for
  // it.
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {}
  // StreamRunLog sends a Run's captured output, and with follow keeps sending
  // until the Run ends.
  rpc StreamRunLog(StreamRunLogRequest) returns (stream StreamRunLogResponse) {}
  // AcceptJob keeps a Job's work, reclaiming its worktree and leaving its
  // branch where it is (ADR-0015).
  rpc AcceptJob(AcceptJobRequest) returns (AcceptJobResponse) {}
  // DropJob refuses a Job's work, reclaiming its worktree and deleting its
  // branch.
  rpc DropJob(DropJobRequest) returns (DropJobResponse) {}
  // GetOverview reports what is running, how the Jobs stand, and which of them
  // are waiting for a decision.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {}
  // ExtendJob gives a Job more attempts, returning it to the queue if it had
  // run out (ADR-0025).
  rpc ExtendJob(ExtendJobRequest) returns (ExtendJobResponse) {}
  // PauseRun freezes the Run in progress and everything its Agent started.
  rpc PauseRun(PauseRunRequest) returns (PauseRunResponse) {}
  // ResumeRun continues a frozen Run where it was.
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse) {}
}

// JobState is the lifecycle of a Job (ADR-0025, ADR-0027).
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  // JOB_STATE_PENDING is queued and waiting to be run.
  JOB_STATE_PENDING = 1;
  // JOB_STATE_ACTIVE is being run right now.
  JOB_STATE_ACTIVE = 2;
  // JOB_STATE_BLOCKED is stuck on something wrong with the work.
  JOB_STATE_BLOCKED = 3;
  // JOB_STATE_REVIEW is finished and waiting for a decision.
  JOB_STATE_REVIEW = 4;
  // JOB_STATE_DONE is finished and accepted.
  JOB_STATE_DONE = 5;
  // JOB_STATE_CANCELLED was taken out of the queue by hand.
  JOB_STATE_CANCELLED = 6;
  // JOB_STATE_EXHAUSTED ran out of attempts.
  JOB_STATE_EXHAUSTED = 7;
}

// Job is one standing intent to do a piece of work in one Project.
message Job {
  // Id identifies the Job. It is what owl queue commands take.
  int64 id = 1;
  // Source names the producer the Job came from; the local queue is "local".
  string source = 2;
  // SourceRef is the Job's reference within that Source, unique with it
  // (ADR-0032). The local queue generates a ulid.
  string source_ref = 3;
  // Project is the name of the Project the Job is queued against.
  string project = 4;
  // Prompt is the work to do.
  string prompt = 5;
  // State is where the Job is in its lifecycle.
  JobState state = 6;
  // Position is the Job's place in the queue, counting from one. It is zero
  // for a Job that is not queued.
  int32 position = 7;
  // Created is when the Job was first produced.
  google.protobuf.Timestamp created = 8;
  // Branch is the branch the Job's work lands on, empty until it has one
  // (ADR-0007).
  string branch = 9;
  // Worktree is where that branch is checked out, empty until it has one.
  string worktree = 10;
  // Planned is whether the Job is planned before it is executed (ADR-0026).
  bool planned = 11;
  // Plan is what its planning Run decided, empty until there is one.
  string plan = 12;
  // Reason is why the Job is where it is when no Run explains it: a setup
  // command that failed before an Agent started, or the checks that refused
  // the work.
  string reason = 13;
  // Ttl is how many Runs the Job may still take. One is spent at the end of
  // every Run whatever its outcome, and a Job with none left is exhausted
  // rather than pending (ADR-0025).
  int32 ttl = 14;
  // Account is the Account the Job ran on, taken from its Project's
  // configuration at its first Run and unchanged afterwards (ADR-0023). It is
  // empty until the Job has run.
  string account = 15;
}

// PlanMode is whether a Job is planned before it is executed. Planning is the
// default, so leaving it unspecified plans (ADR-0026).
enum PlanMode {
  // PLAN_MODE_UNSPECIFIED plans, like PLAN_MODE_PLAN.
  PLAN_MODE_UNSPECIFIED = 0;
  // PLAN_MODE_PLAN plans the Job before executing it.
  PLAN_MODE_PLAN = 1;
  // PLAN_MODE_NO_PLAN executes it without planning first.
  PLAN_MODE_NO_PLAN = 2;
}

// CheckResult is what one Verification check said about a Run (ADR-0013).
message CheckResult {
  // Name identifies the check.
  string name = 1;
  // Command is what it ran.
  string command = 2;
  // Passed is whether it was satisfied.
  bool passed = 3;
  // ExitCode is what the command exited with.
  int32 exit_code = 4;
  // Output is what it printed, standard error included.
  string output = 5;
  // Reason says why it failed, empty for a check that passed.
  string reason = 6;
  // Verifier is which Verifier said it: `command` for a Project's own check,
  // `agent` for the Agent it asked to judge the work (ADR-0013).
  string verifier = 7;
}

// PhaseSettings is what one phase of a Job runs at, and where each setting
// came from: the defaults, the daemon's configuration, the Project's, or the
// Job itself (ADR-0028).
message PhaseSettings {
  string phase = 1;
  string model = 2;
  string model_from = 3;
  string effort = 4;
  string effort_from = 5;
}

// RunOutcome is how a Run ended (ADR-0027).
enum RunOutcome {
  // RUN_OUTCOME_UNSPECIFIED is a Run that has not ended yet.
  RUN_OUTCOME_UNSPECIFIED = 0;
  // RUN_OUTCOME_SUCCEEDED is an Agent that exited cleanly.
  RUN_OUTCOME_SUCCEEDED = 1;
  // RUN_OUTCOME_FAILED is an Agent that exited non-zero, or could not be run.
  RUN_OUTCOME_FAILED = 2;
  // RUN_OUTCOME_INTERRUPTED is a Run that was stopped rather than finished.
  RUN_OUTCOME_INTERRUPTED = 3;
}

// Run is one attempt to carry out a Job (ADR-0027).
message Run {
  // Id identifies the Run and is what owl logs takes.
  int64 id = 1;
  // JobId is the Job this Run is an attempt at.
  int64 job_id = 2;
  // Attempt counts this Job's Runs, from one.
  int32 attempt = 3;
  // Started is when the Agent was launched.
  google.protobuf.Timestamp started = 4;
  // Ended is when it exited, and is unset while the Run is still going.
  google.protobuf.Timestamp ended = 5;
  // Outcome is how it ended.
  RunOutcome outcome = 6;
  // Error is why it did not succeed.
  string error = 7;
  // LogPath is where its structured output was captured.
  string log_path = 8;
  // Phase is what the Run was carrying out: planning the Job, or executing it.
  string phase = 10;
  // Paused is whether the Run is frozen right now (ADR-0011). Only a run this
  // daemon is carrying out can be.
  bool paused = 12;
  // Stage is where a Run that has not ended is: starting, agent, verifying or
  // finishing. Only the daemon carrying it out knows, and it is empty for a
  // Run that has ended.
  string stage = 13;
  // ExitCode is what the Agent exited with, and -1 when it never got far
  // enough to have one.
  int32 exit_code = 9;
  // Skills is what this Run read, so that what an Agent did is attributable to
  // the instructions it had (ADR-0024).
  repeated Skill skills = 11;
}

message PauseRunRequest {}

message PauseRunResponse {
  Run run = 1;
}

message ResumeRunRequest {}

message ResumeRunResponse {
  Run run = 1;
}

message AddJobRequest {
  // Project names the Project to queue against. Empty means the Project the
  // working directory is in.
  string project = 1;
  // Prompt is the work to do.
  string prompt = 2;
  // WorkingDir is an absolute path to the directory the caller ran in.
  string working_dir = 3;
  // PlanMode is whether to plan the Job before executing it.
  PlanMode plan_mode = 4;
  // Model and Effort override what every phase of this Job runs at. Empty
  // leaves it to the Project and the defaults.
  string model = 5;
  string effort = 6;
  // Ttl is how many Runs the Job may take. Zero asks for no particular number
  // and takes the default of ten (ADR-0025).
  int32 ttl = 7;
}

message AddJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  // All returns every Job whatever its state, rather than only the queue.
  bool all = 1;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  int64 id = 1;
}

message CancelJobResponse {
  Job job = 1;
}

message ReorderJobRequest {
  int64 id = 1;
  // Position counts from one.
  int32 position = 2;
}

message ReorderJobResponse {
  Job job = 1;
}

message StartRunRequest {}

message StartRunResponse {
  // Started is false when the queue held nothing to run, which is not a
  // failure.
  bool started = 1;
  Job job = 2;
  Run run = 3;
}

message GetJobRequest {
  int64 id = 1;
}

message GetJobResponse {
  Job job = 1;
  repeated Run runs = 2;
  // VerifierSystemPrompt is the contract with the Agent that verifies the
  // work, for a Project that asked for one and empty for one that did not
  // (ADR-0013, ADR-0017).
  string verifier_system_prompt = 8;
  // SystemPrompt is the unattended contract with the Project's own clauses
  // appended, exactly as the Agent is given it (ADR-0017).
  string system_prompt = 3;
  // Checks is what Verification said about the Job's most recent verified Run,
  // in the order the checks were configured (ADR-0030).
  repeated CheckResult checks = 5;
  // Phases is what each phase of the Job runs at, in the order it passes
  // through them.
  repeated PhaseSettings phases = 4;
  // Handoff is the document on the Job's branch carrying intent and progress
  // from one Run to the next (ADR-0026), empty until a Run has written one.
  string handoff = 6;
  // Diff summarises what the Job's branch changed against the Project's base
  // branch. It is empty for a Job without a branch, or whose branch is gone.
  DiffSummary diff = 7;
}

// DiffSummary is what a Job's branch changed, per file and in total.
message DiffSummary {
  repeated DiffFile files = 1;
  int32 insertions = 2;
  int32 deletions = 3;
}

// DiffFile is one file a Job's branch changed. A binary file counts as changed
// with no lines.
message DiffFile {
  string path = 1;
  int32 insertions = 2;
  int32 deletions = 3;
}

message StreamRunLogRequest {
  int64 run_id = 1;
  // Follow keeps the stream open until the Run ends.
  bool follow = 2;
}

message StreamRunLogResponse {
  // Line is one line of the Agent's structured output.
  string line = 1;
}

message AcceptJobRequest {
  int64 id = 1;
  // Force reclaims a worktree holding changes nobody has committed. Without
  // it, disposal refuses rather than destroying work silently (ADR-0015).
  bool force = 2;
}

message AcceptJobResponse {
  Job job = 1;
}

message DropJobRequest {
  int64 id = 1;
  // Force reclaims a worktree holding changes nobody has committed.
  bool force = 2;
}

message DropJobResponse {
  Job job = 1;
}

message ExtendJobRequest {
  int64 id = 1;
  // Ttl is how many attempts to add. Zero asks for no particular number and
  // adds the default of ten.
  int32 ttl = 2;
}

message ExtendJobResponse {
  Job job = 1;
}

message GetOverviewRequest {}

// JobStateCount is how many Jobs are in one state.
message JobStateCount {
  JobState state = 1;
  int32 count = 2;
}

// RunInProgress is a Run that has not ended, with the Job it is an attempt at.
message RunInProgress {
  Run run = 1;
  Job job = 2;
}

message GetOverviewResponse {
  // Running is every Run that has not ended.
  repeated RunInProgress running = 1;
  // Counts is how the Jobs stand, in the order a Job passes through the
  // states, and holding only the states that have Jobs in them.
  repeated JobStateCount counts = 2;
  // Awaiting is the Jobs in review, waiting for someone to accept or drop
  // them.
  repeated Job awaiting = 3;
  // Blocked is the Jobs stuck on something wrong with the work.
  repeated Job blocked = 4;
  // Exhausted is the Jobs that have run out of attempts. Nothing is wrong with
  // them; they want more attempts or a decision (ADR-0025).
  repeated Job exhausted = 5;
  // Unfinished is what garbage collection found and would not touch: a
  // worktree holding changes nobody committed, a Job waiting too long for a
  // decision, a Job left active by a daemon that died (ADR-0015).
  repeated Unfinished unfinished = 6;
  // Machine is what the daemon last read about the machine it runs on, which
  // is why work is or is not happening (ADR-0011).
  Machine machine = 7;
}

// Machine is the machine Owl runs on, as the daemon last read it (ADR-0011).
message Machine {
  // Read is whether it could be read at all. Everything else here is worth
  // nothing when it is false.
  bool read = 1;
  // Idle is whether it is a machine Owl may work on, under the policy.
  bool idle = 2;
  // Since is how long it has been since any keyboard or mouse input.
  google.protobuf.Duration since = 3;
  // OnPower is whether it is drawing from AC power.
  bool on_power = 4;
  // Detail is why it is not a machine Owl may work on, or why it could not be
  // read. Empty when it is Idle.
  string detail = 5;
}
