syntax = "proto3";

package codingowl.v1;

import "google/protobuf/timestamp.proto";

// ProjectService registers git repositories as Projects and reports how each
// one is configured. A Project is identified by its name (ADR-0031) and its
// configuration is discovered from its base branch (ADR-0014).
service ProjectService {
  // AddProject registers a repository.
  rpc AddProject(AddProjectRequest) returns (AddProjectResponse) {}
  // ListProjects returns every Project, ordered by name.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {}
  // GetProject returns one Project with the configuration in force for it.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {}
  // MoveProject points a Project at a new path, leaving its identity alone.
  rpc MoveProject(MoveProjectRequest) returns (MoveProjectResponse) {}
  // RenameProject changes a Project's name and moves its configuration
  // directory with it.
  rpc RenameProject(RenameProjectRequest) returns (RenameProjectResponse) {}
  // RemoveProject deregisters a Project.
  rpc RemoveProject(RemoveProjectRequest) returns (RemoveProjectResponse) {}
  // SetupProject writes a Project's first configuration file: the Account its
  // Jobs run on, and nothing else. A Project that already has one is refused.
  rpc SetupProject(SetupProjectRequest) returns (SetupProjectResponse) {}
}

// Project is a registered git repository.
message Project {
  // Name identifies the Project and names its configuration directory.
  string name = 1;
  // Path is where the repository sits now.
  string path = 2;
  // BaseBranch is the branch Jobs branch from and configuration is read from.
  string base_branch = 3;
  // Registered is when the Project was first added.
  google.protobuf.Timestamp registered = 4;
}

// ProjectConfig is the configuration in force for a Project.
message ProjectConfig {
  // Source names the file it came from: "<branch>:<path>" for an in-repo
  // form, an absolute path for the config-home fallback, empty when no file
  // was found and the defaults apply.
  string source = 1;
  // BranchPrefix is prepended to the branch of every Job in the Project.
  string branch_prefix = 2;
  // Account names the Account every Job in this Project runs on (ADR-0023).
  // Empty is a Project that names none, which cannot run until it does.
  string account = 3;
}

message AddProjectRequest {
  // Path is an absolute path to the repository root.
  string path = 1;
  // Name overrides the directory basename when set.
  string name = 2;
  // BaseBranch overrides the repository's current branch when set.
  string base_branch = 3;
}

message AddProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  string name = 1;
}

message GetProjectResponse {
  Project project = 1;
  ProjectConfig config = 2;
}

message MoveProjectRequest {
  string name = 1;
  // Path is an absolute path to the repository's new root.
  string path = 2;
}

message MoveProjectResponse {
  Project project = 1;
}

message RenameProjectRequest {
  string name = 1;
  string new_name = 2;
}

message RenameProjectResponse {
  Project project = 1;
}

message RemoveProjectRequest {
  string name = 1;
}

message RemoveProjectResponse {
  // JobsRemoved is how many Jobs went with the Project, queued or not, since
  // a Job whose Project is gone has nowhere to run.
  int32 jobs_removed = 1;
}

message SetupProjectRequest {
  // Project names the Project, or a path inside one. Empty means the Project
  // WorkingDir is in.
  string project = 1;
  // WorkingDir is an absolute path to the directory the caller ran in.
  string working_dir = 2;
  // Path is Project made absolute against the caller's working directory,
  // for when it names a path rather than a Project. It is sent alongside the
  // raw argument because only the caller knows what a relative path is
  // relative to, and empty when no argument was given.
  string path = 3;
  // Account is the Account this Project's Jobs will run on (ADR-0023).
  string account = 4;
  // InRepo asks for `.coding-owl.yaml` in the repository, which is committed
  // and read from the base branch, rather than the config-home fallback,
  // which is read from disk (ADR-0014).
  bool in_repo = 5;
}

message SetupProjectResponse {
  ConfigFile file = 1;
}

// ConfigFile is a configuration file on disk, and whether it is one a Run
// reads from the base branch rather than from where it was written.
message ConfigFile {
  string path = 1;
  // InRepo is true for a file in the Project's repository, which does nothing
  // until it is committed (ADR-0014).
  bool in_repo = 2;
}
