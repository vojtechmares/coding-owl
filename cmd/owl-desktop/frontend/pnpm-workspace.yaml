# pnpm runs no dependency's install script unless it is named here, and under
# a strict setting refuses to install at all while one is left unnamed.
# esbuild's script only readies its command-line shim - Vite reaches the
# platform binary through the JS API either way - and it is the one script
# the frontend's dependencies carry.
allowBuilds:
  esbuild: true

# Under a trust policy that refuses a downgrade, semver 6.3.1 - which Babel
# pulls in through @vitejs/plugin-react - is refused: it was published after
# semver 7 started carrying provenance, and pnpm judges trust by publish date
# rather than by major version. It is the same semver every Babel user has,
# and the one exception the frontend's dependencies need.
trustPolicyExclude:
  - semver@6.3.1
